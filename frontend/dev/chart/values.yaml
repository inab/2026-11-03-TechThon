# Participants set these in their values file (my-values.example.yaml); the
# defaults here are for the local kind cluster.

# The app runs at <scheme>://<host>/<path>/. Lowercase letters, numbers and
# dashes. To change it: edit the values file, then helm upgrade ... -f <file>
path: ""

host: localhost
scheme: http
ingressClassName: traefik

# The published image. To try local code instead, push it to the local
# registry and use repository localhost:5001/workshop-frontend, tag dev.
image:
  repository: ghcr.io/inab/2026-11-03-techthon-frontend
  tag: main
  pullPolicy: Always

keycloak:
  serverUrl: http://keycloak.localhost:8080
  realm: workshop
  clientId: nuxt-workshop
  # The client secret, usually given in the participant's values file. The
  # chart then stores it in a Secret of its own.
  clientSecret: ""
  # Used only when clientSecret is empty: an existing Secret in the namespace
  # with the key "client-secret" (locally created by dev/kind/cluster.sh).
  clientSecretName: workshop-keycloak

resources:
  requests: { memory: 128Mi, cpu: 50m }
  limits: { memory: 256Mi }
