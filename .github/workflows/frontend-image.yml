# Builds the frontend image and publishes it to GitHub's container registry:
#   ghcr.io/inab/2026-11-03-techthon-frontend
#
#   push to main (frontend/ changed)  -> tags "main" and "sha-<commit>"
#   tag v1.2.3                        -> tags "1.2.3", "1.2" and "latest"
#   pull request                      -> builds only, publishes nothing
#
# Logs in with the token GitHub gives every run; no secrets to set up.
name: Frontend image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - frontend/**
      - .github/workflows/frontend-image.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/inab/2026-11-03-techthon-frontend

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub's container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown on the app's protected page.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
