{{- /*
  The Keycloak client secret, when the participant gives it in their values
  file (keycloak.clientSecret). Without it, the chart uses an existing Secret
  instead (keycloak.clientSecretName).
*/ -}}
{{- if .Values.keycloak.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.keycloak.clientSecret | quote }}
{{- end }}
