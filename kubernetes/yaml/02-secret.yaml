# Session 2: the two secret values your app needs.
# Don't share this file once filled in.
apiVersion: v1
kind: Secret
metadata:
  name: YOUR_USERNAME-web-secret
  labels:
    app: YOUR_USERNAME-web
type: Opaque
stringData:
  # From the coordinator.
  NUXT_OAUTH_KEYCLOAK_CLIENT_SECRET: REPLACE-client-secret
  # Any random text of at least 32 characters. Make one with: openssl rand -hex 24
  NUXT_APP_SECRET: REPLACE-with-at-least-32-random-characters
