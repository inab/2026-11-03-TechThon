{{- /* Session secret, generated once per release and kept across upgrades. */ -}}
{{- $name := printf "%s-app" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (index $existing.data "app-secret") }}
  app-secret: {{ index $existing.data "app-secret" }}
  {{- else }}
  app-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
